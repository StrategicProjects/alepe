on:
  workflow_dispatch:

name: api-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DNS and TCP reachability
        run: |
          echo "== DNS"
          getent hosts dadosabertos.alepe.pe.gov.br || echo "   DNS FAILED"
          echo "== TCP connect to :443 (10s limit)"
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/dadosabertos.alepe.pe.gov.br/443' \
            && echo "   TCP OK" || echo "   TCP FAILED rc=$?"
      - name: HTTP probe with connect/TLS timings
        run: |
          UA="alepe R package (https://github.com/StrategicProjects/alepe)"
          for ep in contratos cargos; do
            echo "== /$ep (fast endpoint: <1s from Brazil)"
            curl -sS -A "$UA" -o /dev/null --max-time 60 \
              -w "   http=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s size=%{size_download}\n" \
              "https://dadosabertos.alepe.pe.gov.br/api/v1/$ep/" || echo "   curl rc=$?"
          done
